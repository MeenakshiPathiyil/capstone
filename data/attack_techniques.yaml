# MITRE ATT&CK — Enterprise / Cloud / IaaS matrix.
#
# Source: https://attack.mitre.org/matrices/enterprise/cloud/iaas/
#
# THEORY (why this file exists):
# attack_path/exporter.py orders a path's techniques by the phase an attacker uses
# them in, and that ordering used to come from a hand-written dict inside the
# exporter.
# A hand-written mapping drifts and cannot be checked against anything. This file
# is the IaaS matrix itself, so the ordering is ATT&CK's rather than ours, and a
# rule citing a technique outside this file is a rule citing a technique that is
# not in the cloud matrix — which tests/test_security_rules.py now rejects.
#
# WHY IaaS AND NOT ENTERPRISE:
# Our target is cloud infrastructure, so a technique must be in the IaaS matrix to
# be a claim we can defend. Two techniques the ruleset used to cite are NOT in it:
#   T1133 (External Remote Services) — IaaS initial access is T1190/T1199/T1078
#   T1567.002 (Exfiltration to Cloud Storage) — IaaS exfiltration is T1048/T1537
# Both were replaced rather than kept.
#
# PRIMARY TACTIC:
# ATT&CK lists several techniques under more than one tactic (T1078 appears under
# initial access, persistence, privilege escalation and stealth). Ordering a
# narrative needs exactly one position per technique, so each entry below carries
# one `tactic` — the point in a chain where an attacker is first using it — and
# `also` records the other tactics ATT&CK lists it under, so nothing is lost.

# The order this project narrates an attack in. The index of a tactic here is a
# technique's rank.
#
# NOT ATT&CK's ordering. ATT&CK has none: its FAQ says "ATT&CK Tactics are
# unordered and may not all occur in a single intrusion", and its own listing
# puts credential access after privilege escalation, which this reverses. The
# sequence below is ours, chosen so a generated scenario reads as a narrative.
# See docs/research/precondition-sources.md.
tactics:
  - initial access
  - execution
  - persistence
  - privilege escalation
  - stealth
  - defense impairment
  - credential access
  - discovery
  - lateral movement
  - collection
  - exfiltration
  - impact

techniques:

