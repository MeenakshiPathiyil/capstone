    Standalone security group ingress rule allows unrestricted incoming TCP
    traffic on a restricted port.

  deviations:
    - "per-type copy. The canonical rule is indexed on AWS::EC2::SecurityGroup
       only, so the standalone AWS::EC2::SecurityGroupIngress spelling of the
       same fact was never evaluated"
    - "added `scope: ingress`, as on the AWS::EC2::SecurityGroup copy"

  conditions:
    scope: ingress
    operator: AND
    operands:

      - field: protocol
        comparison: equals
        value: tcp

      - operator: OR
        operands:
          - field: port
            comparison: equals
            value: "{blockedPort1}"
          - field: port
            comparison: equals
            value: "{blockedPort2}"
          - field: port
            comparison: equals
            value: "{blockedPort3}"
          - field: port
            comparison: equals
            value: "{blockedPort4}"
          - field: port
            comparison: equals
            value: "{blockedPort5}"

      - operator: OR
        operands:
          - field: cidr
            comparison: equals
            value: 0.0.0.0/0
          - field: cidr
            comparison: equals
            value: "::/0"

  parameters:
    blockedPort1: 20
    blockedPort2: 21
    blockedPort3: 3389
    blockedPort4: 3306
    blockedPort5: 4333

  attack_techniques:
    - id: T1190
      name: Exploit Public-Facing Application
    - id: T1021
      name: Remote Services

  references:
    - source: aws_config
      id: RESTRICTED_INCOMING_TRAFFIC
      url: https://docs.aws.amazon.com/config/latest/developerguide/restricted-common-ports.html


