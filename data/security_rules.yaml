# Security rules.
#
# ORIGIN:
# The first block is the canonical ruleset (rulesets/canonical_rules.yaml,
# Meenakshi's, derived from AWS Config managed rules), all 12 of its rules. Their
# `id`, `source_id`, `service`, `semantic`, `state`, `summary`, `parameters` and
# `references` are hers, unchanged; tests/test_canonical_rules.py checks that.
# Their conditions are hers rewritten into this engine's syntax: parameters as
# {placeholders}, and field names relative to a `scope`. Where a rewrite changes
# what a rule matches, the reason is written next to it under `deviations:`.
# The two AWS::EC2::SecurityGroupIngress rules are her two security group rules
# again, for the standalone spelling of an inbound rule.
#
# The second block is ours: seven rules with no canonical equivalent, which are
# what make an attack *path* findable rather than a list of unrelated findings.
# See the section header before them.
#
# WHAT THIS FILE DELIBERATELY DOES NOT CARRY:
# `severity`. The canonical rules do not declare one, and inventing a number per
# rule is a judgement we cannot defend rule by rule. security_state_graph/semantics
# derives it from `semantic` through one documented table (SEVERITY_BY_SEMANTIC),
# so there is a single place to change when the risk scoring model is built.
#
# `attack_techniques` IS carried, because those are MITRE ATT&CK IDs cited from
# the public IaaS matrix rather than numbers we chose. Every ID here must exist in
# data/attack_techniques.yaml with the matrix's own name for it, which
# tests/test_security_rules.py enforces.
#
# THE FIELD NAMES ARE ABSTRACT, NOT CLOUDFORMATION:
# `ingress.port`, `bucket.name`, `BucketPolicy.AllowsPublicRead` and the rest are
# projected from raw template properties by processing/attributes.py. A rule
# written against `SecurityGroupIngress[0].FromPort` would only work on
# CloudFormation and would need a second copy for the standalone
# AWS::EC2::SecurityGroupIngress spelling of the same fact.


# ==============================================================================
# CANONICAL RULES
# ==============================================================================

- id: aws_config:RESTRICTED_INCOMING_TRAFFIC:AWS::EC2::SecurityGroup
  origin: aws_config
  source_id: RESTRICTED_INCOMING_TRAFFIC
  service: ec2
  resource_type: AWS::EC2::SecurityGroup
  semantic: network_control

  state:
    id: sg_unrestricted_common_port
    display_name: Security group allows unrestricted incoming traffic on a restricted port

  summary: >
    Security group allows unrestricted incoming TCP traffic on a restricted port.

  # THE DEVIATION, AND WHY IT MATTERS:
  # The canonical rule has protocol, port and cidr as three sibling leaves under
  # one AND. Each leaf resolves against *every* ingress entry independently, so a
  # group holding `tcp/443/0.0.0.0/0` and `tcp/3306/10.0.0.0/8` matched: protocol
  # and CIDR came from the first entry, the port from the second. Neither entry is
  # a problem and the rule fired anyway.
  #
  # `scope: ingress` evaluates the subtree once per ingress entry and ORs the
  # results, so all three conditions have to hold on the *same* entry.
  deviations:
    - "added `scope: ingress`, so the three conditions must hold on one ingress
       entry rather than being satisfied across different entries"

  conditions:
    scope: ingress
    operator: AND
    operands:

      - field: protocol
        comparison: equals
        value: tcp

      - operator: OR
        operands:
          - field: port
            comparison: equals
            value: "{blockedPort1}"
          - field: port
            comparison: equals
            value: "{blockedPort2}"
          - field: port
            comparison: equals
            value: "{blockedPort3}"
          - field: port
            comparison: equals
            value: "{blockedPort4}"
          - field: port
            comparison: equals
            value: "{blockedPort5}"

      - operator: OR
        operands:
          - field: cidr
            comparison: equals
            value: 0.0.0.0/0
          - field: cidr
            comparison: equals
            value: "::/0"

  parameters:
    blockedPort1: 20
    blockedPort2: 21
    blockedPort3: 3389
    blockedPort4: 3306
    blockedPort5: 4333

  attack_techniques:
    - id: T1190
      name: Exploit Public-Facing Application
    - id: T1021
      name: Remote Services

  references:
    - source: aws_config
      id: RESTRICTED_INCOMING_TRAFFIC
      url: https://docs.aws.amazon.com/config/latest/developerguide/restricted-common-ports.html


- id: aws_config:INCOMING_SSH_DISABLED:AWS::EC2::SecurityGroup
  origin: aws_config
  source_id: INCOMING_SSH_DISABLED
  service: ec2
  resource_type: AWS::EC2::SecurityGroup
  semantic: network_control

  state:
    id: sg_unrestricted_ssh
    display_name: Security group allows unrestricted SSH

  summary: >
    Security group allows unrestricted SSH ingress on port 22.

  deviations:
    - "added `scope: ingress`, for the same reason as RESTRICTED_INCOMING_TRAFFIC:
       without it the port and the CIDR can be satisfied by two different
       ingress entries"

  conditions:
    scope: ingress
    operator: AND
    operands:

      - field: port
        comparison: equals
        value: 22

      - operator: OR
        operands:
          - field: cidr
            comparison: equals
            value: 0.0.0.0/0
          - field: cidr
            comparison: equals
            value: "::/0"

  attack_techniques:
    - id: T1190
      name: Exploit Public-Facing Application
    - id: T1021.007
      name: "Remote Services: Cloud Services"

  references:
    - source: aws_config
      id: INCOMING_SSH_DISABLED
      url: https://docs.aws.amazon.com/config/latest/developerguide/restricted-ssh.html


# The same two network rules again, for the standalone spelling.
#
# WHY THESE EXIST:
# The rule engine indexes rules by `resource_type`, and the two rules above are
# AWS::EC2::SecurityGroup only. An inbound rule declared as its own
# AWS::EC2::SecurityGroupIngress resource therefore had no rule looking at it,
# and real templates use that shape constantly. The projection in
# processing/attributes.py already turns both spellings into one `ingress` list,
# so the conditions are identical and only the indexed type differs.
#
# Per-type copies rather than one rule with a list of types, because that is the
# pattern the canonical file already uses for REQUIRED_TAGS.

