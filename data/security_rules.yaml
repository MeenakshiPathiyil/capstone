- id: aws_config:S3_BUCKET_POLICY_GRANTEE_CHECK:AWS::S3::Bucket
  origin: aws_config
  source_id: S3_BUCKET_POLICY_GRANTEE_CHECK
  service: s3
  resource_type: AWS::S3::Bucket
  semantic: trust

  state:
    id: s3_bucket_policy_untrusted_principal
    display_name: S3 bucket policy grants access outside the trusted principal set

  summary: >
    S3 bucket policy grants access to a principal outside the trusted set
    defined by 203.0.113.0/24, 198.51.100.0/24.

  # BucketPolicy.Grantee is every principal the bucket's policy names, so any
  # principal outside the trusted set fires the rule, a wildcard "*" included.
  conditions:
    field: BucketPolicy.Grantee
    comparison: not_in
    value: ["203.0.113.0/24", "198.51.100.0/24"]

  parameters:
    ipAddresses: ["203.0.113.0/24", "198.51.100.0/24"]

  attack_techniques:
    - id: T1530
      name: Data from Cloud Storage

  references:
    - source: aws_config
      id: S3_BUCKET_POLICY_GRANTEE_CHECK
      url: https://docs.aws.amazon.com/config/latest/developerguide/s3-bucket-policy-grantee-check.html


# ==============================================================================
# NOT IN THE CANONICAL RULESET - OURS
# ==============================================================================
#
# These seven have no canonical equivalent and they are load-bearing, not extra.
# The canonical set finds misconfigurations; these are what turn a set of
# misconfigurations into a *path*:
#
#   * EC2_PUBLIC_IP and ELB_INTERNET_FACING mark a resource as reachable from
#     the internet, which is what makes it a possible entry point.
#   * EC2_IMDSV1_ENABLED, IAM_WILDCARD_PERMISSIONS and IAM_TRUST_POLICY_WILDCARD
#     carry `semantic: privilege`, and attack_path/path_finder requires a privilege
#     step somewhere in the middle of a chain before it will report the chain as
#     an attack path. The canonical set has no `privilege` semantic at all, so
#     without these every candidate path is rejected and the tool reports zero.
#
# So deleting this block does not lose seven rules, it loses every attack path.
#
# TO WHOEVER OWNS THE CANONICAL RULESET:
# these are ours and are meant to be replaced. The open question is whether
# `privilege` should become a canonical semantic, since the canonical vocabulary
# (network_control, exposure, capability, identity, trust, impact) has no way to
# say "this grants the attacker authority they did not have".

- id: EC2_PUBLIC_IP
  origin: capstone
  source_id: EC2_PUBLIC_IP
  service: ec2
  resource_type: AWS::EC2::Instance
  semantic: exposure

  state:
    id: instance_with_public_ip
    display_name: Instance With Public IP

  summary: >
    EC2 instance is assigned a public IP address, so it is reachable from the
    internet subject only to its security groups.

  conditions:
    operator: AND
    operands:
      - field: AssociatePublicIpAddress
        comparison: equals
        value: "{associatePublicIpAddress}"

  parameters:
    associatePublicIpAddress: true

  attack_techniques:
    - id: T1190
      name: Exploit Public-Facing Application
    - id: T1552.005
      name: "Unsecured Credentials: Cloud Instance Metadata API"


- id: ELB_INTERNET_FACING
  origin: capstone
  source_id: ELB_INTERNET_FACING
  service: elasticloadbalancing
  resource_type: AWS::ElasticLoadBalancingV2::LoadBalancer
  semantic: exposure

  state:
    id: internet_facing_load_balancer
    display_name: Internet Facing Load Balancer

  summary: >
    Load balancer has an internet-facing scheme, so everything behind it is
    reachable from the internet through its listeners.

  conditions:
    operator: AND
    operands:
      - field: Scheme
        comparison: equals
        value: "{internetFacingScheme}"

  parameters:
    internetFacingScheme: internet-facing

  attack_techniques:
    - id: T1190
      name: Exploit Public-Facing Application
    - id: T1021.007
      name: "Remote Services: Cloud Services"


- id: RDS_PUBLICLY_ACCESSIBLE
  origin: capstone
  source_id: RDS_PUBLICLY_ACCESSIBLE
  service: rds
  resource_type: AWS::RDS::DBInstance
  semantic: exposure

  state:
    id: publicly_accessible_database
    display_name: Publicly Accessible Database

  summary: >
    Database instance has a public endpoint, so it is reachable from the
    internet subject only to its security groups.

  # NOT the same thing as the canonical RDS_STORAGE_ENCRYPTED. That rule is about
  # data at rest; this one is about whether an attacker can reach the database at
  # all, which is what makes it an entry point. Dropping it in the canonical swap
  # would have silently removed every path that starts at a database.
  conditions:
    operator: AND
    operands:
      - field: PubliclyAccessible
        comparison: equals
        value: "{publiclyAccessible}"

  parameters:
    publiclyAccessible: true

  attack_techniques:
    - id: T1190
      name: Exploit Public-Facing Application
    - id: T1078
      name: Valid Accounts

  references:
    - source: aws_config
      id: RDS_INSTANCE_PUBLIC_ACCESS_CHECK
      url: https://docs.aws.amazon.com/config/latest/developerguide/rds-instance-public-access-check.html


- id: S3_WILDCARD_POLICY
  origin: capstone
  source_id: S3_WILDCARD_POLICY
  service: s3
  resource_type: AWS::S3::BucketPolicy
  semantic: privilege

  state:
    id: wildcard_bucket_policy
    display_name: Wildcard Bucket Policy

  summary: >
    Bucket policy grants wildcard actions to any principal.

  # OVERLAPS THE CANONICAL RULE, DELIBERATELY.
  # S3_BUCKET_PUBLIC_READ_PROHIBITED reaches the same policy document, but it
  # attributes the finding to the *bucket* and calls it `exposure`. This one
  # attributes it to the policy resource and calls it `privilege`, because a
  # wildcard principal on a wildcard action is not only readable data, it is a
  # grant of authority to anonymous callers. The path search needs it as an
  # authority step, which an `exposure` finding on the bucket cannot be.
  #
  # If a canonical rule ever expresses that, delete this one.
  conditions:
    scope: PolicyDocument.Statement
    operator: AND
    operands:

      - field: Effect
        comparison: equals
        value: "{allowEffect}"

      - operator: OR
        operands:
          - field: Principal
            comparison: equals
            value: "{wildcardPrincipal}"
          - field: Principal.AWS
            comparison: equals
            value: "{wildcardPrincipal}"

      - field: Action
        comparison: contains
        value: "{wildcardAction}"

  parameters:
    allowEffect: Allow
    wildcardPrincipal: "*"
    wildcardAction: "*"

  attack_techniques:
    - id: T1078
      name: Valid Accounts
    - id: T1530
      name: Data from Cloud Storage


- id: EC2_IMDSV1_ENABLED
  origin: capstone
  source_id: EC2_IMDSV1_ENABLED
  service: ec2
  resource_type: AWS::EC2::Instance
  semantic: privilege

  state:
    id: instance_metadata_service_v1_enabled
    display_name: Instance Metadata Service v1 Enabled

  summary: >
    Instance allows IMDSv1, so anything able to make an HTTP request from the
    instance can read the credentials of the role attached to it.

  # This is the step from "the attacker has a server" to "the attacker has IAM
  # credentials". Before this rule existed that step was assumed by the path
  # search rather than resting on a finding.
  conditions:
    operator: NOT
    operand:
      field: MetadataOptions.HttpTokens
      comparison: equals
      value: "{requiredTokenMode}"

  parameters:
    requiredTokenMode: required

  attack_techniques:
    - id: T1552.005
      name: "Unsecured Credentials: Cloud Instance Metadata API"
    - id: T1078.004
      name: "Valid Accounts: Cloud Accounts"


- id: IAM_WILDCARD_PERMISSIONS
  origin: capstone
  source_id: IAM_WILDCARD_PERMISSIONS
  service: iam
  resource_type: AWS::IAM::Role
  semantic: privilege

  state:
    id: wildcard_role_permissions
    display_name: Wildcard Role Permissions

  summary: >
    Role grants every action on every resource, or is assumable by any service.

  conditions:
    operator: OR
    operands:

      - operator: AND
        scope: Policies.PolicyDocument.Statement
        operands:
          - field: Effect
            comparison: equals
            value: "{allowEffect}"
          - field: Action
            comparison: equals
            value: "{wildcardAction}"
          - field: Resource
            comparison: equals
            value: "{wildcardResource}"

      - operator: AND
        scope: AssumeRolePolicyDocument.Statement
        operands:
          - field: Effect
            comparison: equals
            value: "{allowEffect}"
          - field: Principal.Service
            comparison: equals
            value: "{wildcardService}"

  parameters:
    allowEffect: Allow
    wildcardAction: "*"
    wildcardResource: "*"
    wildcardService: "*"

  attack_techniques:
    - id: T1098.001
      name: "Account Manipulation: Additional Cloud Credentials"
    - id: T1078.004
      name: "Valid Accounts: Cloud Accounts"
    - id: T1580
      name: Cloud Infrastructure Discovery


- id: IAM_TRUST_POLICY_WILDCARD
  origin: capstone
  source_id: IAM_TRUST_POLICY_WILDCARD
  service: iam
  resource_type: AWS::IAM::Role
  semantic: privilege

  state:
    id: role_assumable_by_any_principal
