- id: aws_config:S3_BUCKET_LEVEL_PUBLIC_ACCESS_PROHIBITED:AWS::S3::Bucket
  origin: aws_config
  source_id: S3_BUCKET_LEVEL_PUBLIC_ACCESS_PROHIBITED
  service: s3
  resource_type: AWS::S3::Bucket
  semantic: exposure

  state:
    id: s3_bucket_public_access_allowed
    display_name: S3 bucket allows public access

  summary: >
    S3 bucket allows public access through bucket-level public access settings.

  # Unchanged from canonical. `bucket.name not_in []` is vacuously true and reads
  # as an exclusion list nobody has filled in, which is what it is: the parameter
  # `excludedPublicBuckets` is where a bucket that is public on purpose goes.
  #
  # The four flags default to false when PublicAccessBlockConfiguration is absent
  # from the template. That is AWS's own default and it is the insecure one, so
  # a template that never mentions the block matches this rule. See the
  # "absence is a finding" note in processing/attributes.py.
  conditions:
    operator: AND
    operands:

      - field: bucket.name
        comparison: not_in
        value: "{excludedPublicBuckets}"

      - operator: OR
        operands:
          - field: PublicAccessBlockConfiguration.IgnorePublicAcls
            comparison: equals
            value: false
          - field: PublicAccessBlockConfiguration.BlockPublicPolicy
            comparison: equals
            value: false
          - field: PublicAccessBlockConfiguration.BlockPublicAcls
            comparison: equals
            value: false
          - field: PublicAccessBlockConfiguration.RestrictPublicBuckets
            comparison: equals
            value: false

  parameters:
    excludedPublicBuckets: []

  attack_techniques:
    - id: T1530
      name: Data from Cloud Storage
    - id: T1619
      name: Cloud Storage Object Discovery

  references:
    - source: aws_config
      id: S3_BUCKET_LEVEL_PUBLIC_ACCESS_PROHIBITED
      url: https://docs.aws.amazon.com/config/latest/developerguide/s3-bucket-level-public-access-prohibited.html


- id: aws_config:S3_BUCKET_PUBLIC_READ_PROHIBITED:AWS::S3::Bucket
  origin: aws_config
  source_id: S3_BUCKET_PUBLIC_READ_PROHIBITED
  service: s3
  resource_type: AWS::S3::Bucket
  semantic: exposure

  state:
    id: s3_bucket_public_read_allowed
    display_name: S3 bucket allows public read access

  summary: >
    S3 bucket allows public read access through its bucket policy or bucket ACL.

  # THE DEVIATION, AND WHY:
  # The canonical condition tree is
  #
  #   (BlockPublicPolicy == true  OR BucketPolicy.AllowsPublicRead == false)
  #   AND
  #   (BlockPublicAcls   == true  OR BucketAcl.AllowsPublicRead    == false)
  #
  # which describes a bucket that is locked down. Every other rule in the
  # canonical file matches the violation, and this rule's own `state` says
  # "allows public read access", so as written it fired on exactly the buckets
  # that are safe and stayed silent on the public ones.
  #
  # Negated to match its own state name. De Morgan on the tree above gives the
  # OR of two ANDs below, which reads directly: the bucket is publicly readable
  # if its policy allows public read and policy blocking is off, or its ACL
  # allows public read and ACL blocking is off.
  #
  # Confirmed with Nisschay before changing it. If the canonical polarity was
  # intentional, revert this rule and nothing else.
  deviations:
    - condition tree negated. The canonical tree matches a compliant bucket
      while `state` describes a public one, so the rule fired on safe buckets
      and missed public ones

  conditions:
    operator: OR
    operands:

      - operator: AND
        operands:
          - field: BucketPolicy.AllowsPublicRead
            comparison: equals
            value: true
          - field: PublicAccessBlockConfiguration.BlockPublicPolicy
            comparison: equals
            value: false

      - operator: AND
        operands:
          - field: BucketAcl.AllowsPublicRead
            comparison: equals
            value: true
          - field: PublicAccessBlockConfiguration.BlockPublicAcls
            comparison: equals
            value: false

  attack_techniques:
    - id: T1530
      name: Data from Cloud Storage
    - id: T1537
      name: Transfer Data to Cloud Account

  references:
    - source: aws_config
      id: S3_BUCKET_PUBLIC_READ_PROHIBITED
      url: https://docs.aws.amazon.com/config/latest/developerguide/s3-bucket-public-read-prohibited.html


- id: aws_config:RDS_STORAGE_ENCRYPTED:AWS::RDS::DBInstance
  origin: aws_config
  source_id: RDS_STORAGE_ENCRYPTED
  service: rds
