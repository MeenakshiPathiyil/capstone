# The three account-scoped rules.
#
# `resource_type: account` has no CloudFormation equivalent. A template declares
# resources, never the account they live in, so the rule engine indexes these
# under a type no resource ever has and they never fire. They are kept anyway, so
# this file stays a faithful copy of the canonical set and so the gap is visible
# rather than being a silent omission somebody re-adds later.
#
# To make them fire, an account pseudo-resource would have to be synthesised from
# outside the template, from AWS Config or an API call. That is real work and a
# separate piece of it.

- id: aws_config:IAM_PASSWORD_POLICY:account
  origin: aws_config
  source_id: IAM_PASSWORD_POLICY
  service: aws
  resource_type: account
  semantic: capability

  state:
    id: iam_password_policy_weak
    display_name: IAM password policy does not meet required security settings

  summary: >
    IAM account password policy does not satisfy the configured password
    security requirements.

  conditions:
    operator: OR
    operands:
      - field: password_policy.RequireUppercaseCharacters
        comparison: equals
        value: false
      - field: password_policy.RequireLowercaseCharacters
        comparison: equals
        value: false
      - field: password_policy.RequireSymbols
        comparison: equals
        value: false
      - field: password_policy.RequireNumbers
        comparison: equals
        value: false
      - field: password_policy.MinimumPasswordLength
        comparison: less_than
        value: 14
      - field: password_policy.PasswordReusePrevention
        comparison: less_than
        value: 24
      - field: password_policy.MaxPasswordAge
        comparison: greater_than
        value: 90

  parameters:
    RequireUppercaseCharacters: true
    RequireLowercaseCharacters: true
    RequireSymbols: true
    RequireNumbers: true
    MinimumPasswordLength: 14
    PasswordReusePrevention: 24
    MaxPasswordAge: 90

  attack_techniques:
    - id: T1110
      name: Brute Force
    - id: T1201
      name: Password Policy Discovery

  references:
    - source: aws_config
      id: IAM_PASSWORD_POLICY
      url: https://docs.aws.amazon.com/config/latest/developerguide/iam-password-policy.html


- id: aws_config:ROOT_ACCOUNT_MFA_ENABLED:account
  origin: aws_config
  source_id: ROOT_ACCOUNT_MFA_ENABLED
  service: aws
  resource_type: account
  semantic: identity

  state:
    id: root_account_mfa_disabled
    display_name: Root account does not have MFA enabled

  summary: >
    Root account does not have multi-factor authentication (MFA) enabled.

  conditions:
    field: root_account.mfa_enabled
    comparison: equals
    value: false

  attack_techniques:
    - id: T1078
