# REQUIRED_TAGS, three per-type copies.
#
# `semantic: capability` is canonical and is left alone. It does mean these
# findings would otherwise become privilege steps in the path search, because
# `capability` maps to the authority role there, and a missing cost-centre tag is
# not an escalation. security_state_graph/semantics excludes them by `source_id`
# (NON_PATH_SOURCE_IDS), so the finding is still reported and never becomes a hop.
#
# Worth knowing when writing the next `capability` rule: unless it is added to
# that list, it WILL count as the attacker gaining authority.

- id: aws_config:REQUIRED_TAGS:AWS::EC2::Instance
  origin: aws_config
  source_id: REQUIRED_TAGS
  service: ec2
  resource_type: AWS::EC2::Instance
  semantic: capability

  state:
    id: required_tag_missing
    display_name: Required tag is missing

  summary: >
    EC2 instance does not contain the required tag 'CostCenter'.

  conditions:
    operator: NOT
    operand:
      field: tags
      comparison: contains
      value: "{tag1Key}"

  parameters:
    tag1Key: CostCenter

  attack_techniques:
    - id: T1580
      name: Cloud Infrastructure Discovery

  references:
    - source: aws_config
      id: REQUIRED_TAGS
      url: https://docs.aws.amazon.com/config/latest/developerguide/required-tags.html


