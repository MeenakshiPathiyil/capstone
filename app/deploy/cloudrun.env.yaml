# Non-secret settings for the Cloud Run service, passed with --env-vars-file by
# cloudrun_deploy.sh. HF_TOKEN is not here: it comes from Secret Manager.
# Every value must be a string. See app/DEPLOY.md.

# Google's front end routes requests to the container by Host, so only this
# service's own run.app names (or a domain you map to it) ever reach it. Add a
# custom domain here if you map one.
CAPSTONE_ALLOWED_HOSTS: '["*.run.app"]'

# The built web app is served from the same origin, so no extra origins.
CAPSTONE_CORS_ORIGINS: '[]'

# Public deployment: per-client limits on analyses, PDFs and live generations,
# keyed by the client address Cloud Run's front end appends to X-Forwarded-For.
CAPSTONE_RATE_LIMITS_ENABLED: "true"
CAPSTONE_TRUSTED_PROXY_HOPS: "1"

# The model Space and the revisions it was deployed with (app/DEPLOY.md, part 1).
# Leave SPACE_ID empty to deploy without live generation; cached and seeded
# scenarios still show.
SPACE_ID: ""
BASE_REVISION: "c170c708c41dac9275d15a8fff4eca08d52bab71"
ADAPTER_REPO: ""
ADAPTER_REVISION: ""
LOADING_RECIPE: "nf4-dq-unmerged"
SCENARIO_PROMPT_FORMAT: "structured-p1"
