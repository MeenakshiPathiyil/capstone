[pytest]
# One command for the whole repo. The repo root is on sys.path for engine/,
# models/, parser/ and the rest; scenario_generation's scripts import each other
# by bare name, so its three folders are added too (see its own pytest.ini).
pythonpath = . scenario_generation scenario_generation/fine_tuning scenario_generation/evaluation
testpaths = tests scenario_generation/tests risk_scoring
# The app's virtual environment, node_modules and build output sit under app/.
# Its API tests are run explicitly (python -m pytest app/api/tests) with the app
# requirements installed, so they stay out of the core job.
norecursedirs = .* node_modules dist .venv
