[pytest]
# The modules in this repo are flat, imported by bare name after a sys.path shim
# (see evaluation/judge_eval.py, evaluation/evaluate.py, fine_tuning/fine_tune.py).
# pythonpath reproduces that layout for the tests, so `import judge_eval`,
# `import prompt_format` and `import data_split` resolve the same way at test time
# as they do when the scripts are run from scenario_generation/.
pythonpath = . fine_tuning evaluation
testpaths = tests
